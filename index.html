<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gestión digital del permiso de ejecución de trabajo en caliente — Grupo Pana.">
  <meta name="theme-color" content="#1B222B">
  <title>Grupo Pana — Permiso de trabajo en caliente</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icono-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icono-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PETAR Pana">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="cabecera">
    <div class="cabecera__interior">
      <button id="btnAtras" class="cabecera__atras" aria-label="Volver" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="cabecera__textos">
        <strong id="tituloApp">Grupo Pana</strong>
        <small id="subApp">Gestión Digital SST</small>
      </div>
      <span class="cabecera__modulo">Trabajo en caliente</span>
    </div>
    <div id="guardado" class="guardado" aria-live="polite"></div>
  </header>

  <main id="app" class="contenido"></main>

  <footer class="pie">
    <span id="motor">Datos en este dispositivo</span>
    <span>PETAR · MVP</span>
  </footer>

  <div id="avisos" class="avisos" aria-live="polite"></div>

  <!-- Librería de PDF: incluida localmente para que el aplicativo funcione sin conexión -->
  <script src="assets/vendor/jspdf.umd.min.js"></script>

  <!-- Configuración editable del PETAR -->
  <script src="data/config.js"></script>

  <!-- Lógica de la aplicación -->
  <script src="js/ui.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/petar.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
